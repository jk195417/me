      - type: Job
        title: Staff AI Engineer
        subtitle: Micron, Taichung
        tags: [.NET Core, Angular, Kubernetes, Azure]
        link:
        image:
        from: 2019-11
        to: Present
        description: |
          2026-10 – Present: Staff AI Engineer; 2025-10 – 2026-10: Staff Software Engineer; 2023-10 – 2025-10: Senior Software Engineer; 2019-11 – 2023-10: Software Engineer.
          Core platform: build and run an internal workflow and change management platform used by thousands of people every day across Micron's global fab, assembly and test sites, integrated with manufacturing systems to validate, approve and apply changes automatically; brought four new manufacturing facilities onto it.
          Technical leadership: design authority in an engineering org of about 20 for the team's largest programs, leading requirement workshops that turn business processes into developer-ready work. Technical lead for a manufacturing setup automation program (about 94% less setup time); took over and redesigned a stalled cross-team conversion program (first wave live in 2026); stood up a standalone instance for a fab divestiture, and the team was named IT Culture Champions (2021).
          Performance and cost: removed N+1 and per-record database access in two phases, taking the slowest operations from minutes to seconds (over 100x); moved inline images out of the database into object storage (database size down about 99%, database CPU from saturated to under 10%, weekly API outages to zero); rebuilt the data-warehouse export as incremental jobs (data freshness from about 12 hours to about 5 minutes); cut a cloud monitoring bill by about 87%.
          Cloud and reliability: migrated services from Windows Server IIS to Kubernetes and Azure; replaced manual restarts with health checks, liveness probes, autoscaling and global load balancing, taking manual API restarts from 20+ a week to zero and on-call from 60+ to under 5 hours a week; built the platform's observability over six years, from centralized logging to browser-to-database distributed tracing.
          Developer experience and AI: moved the team's repositories and CI to GitHub Actions (CI feedback about 40% faster); turned code-review judgement into AI code review rules A/B-tested with evals; raised test coverage from about 40% to 85% with agent-written tests; set up MCP servers and team Copilot skills. Talk: "Less is More — Designing Agent Context Files from Paper to Production" (2026).
