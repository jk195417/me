        description: |
          2026-10 – Present: Staff AI Engineer; 2025-10 – 2026-10: Staff Software Engineer; 2023-10 – 2025-10: Senior Software Engineer; 2019-11 – 2023-10: Software Engineer.
          Core system: built and maintained an internal workflow and change management system serving 3,000+ daily active users across 7 regions, integrated with manufacturing systems to validate, approve and apply changes automatically. Improved performance by nearly 1,000x by fixing weak spots such as database N+1 queries.
          Team leadership: architect of a 20-person team. Previously led a project with 4 developers, hosting Scrum meetings, code reviews and pair programming. Interview users to understand the business domain, document processes, and provide architecture designs and tech stack consulting for internal and external teams.
          Architecture and cloud: migrated services from Windows Server IIS to Kubernetes with Jenkins, Octopus, Docker and Helm; adopted Azure services (AD, Key Vault, Service Bus, Blob Storage, Cache for Redis, Application Insights, Microsoft Graph API); built a job queue service and a three-layer cache; improved observability with health checks, Application Insights and Kubernetes probes, and centralized all logging.
          Performance: moved 1 TB of base64 files out of the database, cutting CPU from 100% to under 10% and RAM from 64 GB to 8 GB; rewrote ETL jobs, cutting the daily Snowflake upload from 7 hours to 1 minute.
          Quality and operations: introduced unit testing, linters and formatters enforced by git hooks and CI, and cut the team's on-call effort from 60+ hours to under 5 hours a week by grouping incidents by cause and fixing root causes.
