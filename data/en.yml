chapters:
  introduction:
    title: introduction
    content: |
      Hi,
      My name is Yang Hong Xin, you can call me Aaron. I'm from Kaohsiung, Taiwan, and I'm a Staff AI Engineer at Micron. My software engineering journey started in 2014.
      At Feng Chia University I majored in automatic control engineering and fell in love with programming while writing code for 8051, PLC and Arduino. I completed a second program in Computer Science to catch up on data structures, operating systems, algorithms, object orientation and databases.
      For my master's degree I joined Dr. Kuo Feng Yang's lab at National Sun Yat-sen University, researching conversation health on social networks with text mining and natural language processing.
      I joined Micron in 2019. I build and run a workflow and change management platform used by thousands of people every day across Micron's global fab, assembly and test sites, and I'm the design authority in an engineering org of about 20. I'm well-versed in .NET Core, Angular, cloud and containers (Kubernetes, Azure), I care deeply about code quality, observability and developer experience, and lately I bring AI into everyday engineering.
      Strengths: complex problem solving and effective communication.
      Thanks for reading. May the force be with you.
