        description: |
          Echo chambers on social platforms and forums push users into cognitive bias. On political or trending topics they can lead to extremism, divide society and help fake news spread.
          I built a post analyzer with a web crawler and NLP tools, including sentiment analysis, BERT embeddings and semantic clustering, to help experts judge whether a conversation is healthy.
          The case study covers three topics on Dcard: trending news, celebrities and adult content, exploring the environment of each sub-forum. Three social media experts then tried the system and gave feedback to improve it.
