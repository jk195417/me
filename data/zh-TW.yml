  experience:
    title: 經歷
    content:
      - type: Job
        title: Staff AI Engineer
        subtitle: 美光 Micron, 台中市
        tags: [.NET Core, Angular, Kubernetes, Azure]
        link:
        image:
        from: 2019-11
        to: 至今
        description: |
          2026/10 – 至今 Staff AI Engineer；2025/10 – 2026/10 Staff Software Engineer；2023/10 – 2025/10 Senior Software Engineer；2019/11 – 2023/10 Software Engineer。
          核心平台：開發與維運變更管理與簽核平台，全球各廠區每天數千位使用者；與製造系統整合，集中資料、依營運計畫驗證修改、送簽核後自動回寫製造系統；把四個新的製造廠區導入平台。
          技術領導：擔任約 20 人工程組織的設計負責人，主持團隊最大型計畫的需求工作坊，把業務流程轉成開發者可以直接動工的工作；製造設定自動化計畫的技術負責人（設定時間減少約 94%）；接手並重新設計停滯的跨團隊轉換計畫（第一波 2026 年上線）；為出售的晶圓廠建立獨立環境並如期移交，團隊獲得 IT Culture Champions（2021）。
          效能與成本：分兩階段移除 N+1 與逐筆存取，最慢的操作從數分鐘縮到數秒（超過百倍）；把內嵌圖片移出資料庫改存物件儲存（資料庫容量減少約 99%、資料庫主機 CPU 從滿載降到 10% 以下、每週 API 當機歸零）；資料倉儲匯出改成增量，資料延遲從約 12 小時縮到約 5 分鐘；雲端監控費用減少約 87%。
          雲端與可靠性：將服務從 Windows Server IIS 遷移至 Kubernetes 與 Azure；從手動重開主機改成 health check、probe 自動重啟、autoscaling 與全域負載平衡，人工重啟 API 每週 20+ 次降到 0，on-call 每週 60+ 小時降到 5 小時以下；六年來建立從集中式 log 到瀏覽器至資料庫分散式追蹤的可觀測性。
          開發者體驗與 AI：把團隊的 repo 與 CI 遷移到 GitHub Actions（CI 回饋快約 40%）；把 code review 判斷整理成 AI code review 規則並用 eval 做 A/B 測試；由 agent 撰寫測試，覆蓋率從約 40% 提高到 85%；建立 MCP server 與團隊 Copilot skills。演講：「Less is More — Designing Agent Context Files from Paper to Production」（2026）。
