      - type: Master Thesis
        title: 運用自然語言處理工具實作貼文分析系統觀察網路論壇，以 Dcard 為例
        subtitle:
        tags: [BERT, 網路爬蟲, 同質性, Dcard, 情緒分析]
        link: https://hdl.handle.net/11296/gazcm2
        image:
        from: 2017-09
        to: 2019-09
        description: |
          社交平台與公開論壇中的迴聲室效應易造成討論參與者認知偏差，尤其當發生在政治或時事議題討論時，更會造成極端主義以及社會分化的問題，也容易助長假新聞之傳播。
          本篇論文將以 Dcard 論壇上的時事、明星戲劇與成人內容等三大類貼文作為案例，透過網路爬蟲、情感分析與語意分析等文字探勘技術，分析貼文與留言，藉由打造一套人機介面資訊系統，輔助專家判讀對話健康程度與判斷迴聲室效應是否存在於此。
          透過案例探討 Dcard 這個年輕的網路論壇的環境與各個看板的現況。最後請 3 位常於網路瀏覽貼文或參與討論的網路社群專家體驗本系統並給予回饋來改進本系統。
