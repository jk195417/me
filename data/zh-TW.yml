chapters:
  introduction:
    title: 自我介紹
    content: |
      Hi，
      我叫楊竑昕，來自台灣高雄，現任美光科技 Staff AI Engineer，2014 年開始寫程式至今。
      大學就讀逢甲自控系，因為寫 8051、PLC 與 Arduino 而愛上寫程式，修完資工第二學程，補齊資料結構、作業系統、演算法、物件導向與資料庫等基本功。
      碩士在中山資管所，加入郭峰淵老師的實驗室，以文字探勘與自然語言處理研究社群網站的對話健康。
      2019 年加入美光至今，負責服務 7 個地區、每日 3000+ 位使用者的變更管理與簽核系統，帶領 4 人團隊。專長是 .NET Core、Angular、雲端與容器化（Kubernetes、Azure），以及建立測試與 CI/CD 文化。
      閒暇之餘我喜歡參與程式社群認識業界前輩；關注技術趨勢文章；翻翻 Github Trending；做些 side projects。
  skills:
    title: 專業技能
    content:
      description: |
        C# / .NET Core：美光主力後端語言，以 .NET Core、Entity Framework Core 開發 RESTful API，以 xUnit、Moq、AutoFixture、FluentAssertions 撰寫單元測試，熟悉依賴注入、SOLID 與設計模式。
        前端：以 Angular、RxJS、TypeScript 開發內部系統前端，也熟悉 Vue 與 Bootstrap，導入 ESLint、Prettier、Jest 與 husky git hook 統一團隊程式風格。
        DevOps / 雲端：以 Jenkins、Octopus、Docker、Helm 將系統從 Windows Server IIS 遷移至 Kubernetes，導入 Azure AD、Key Vault、Service Bus、Blob Storage、Cache for Redis、Application Insights。
        資料庫與效能：使用 MSSQL、PostgreSQL、MySQL、MongoDB、Redis、RabbitMQ、Snowflake，熟悉索引、鎖、交易、綱要設計與正規化，擅長抓出 N+1 查詢等效能瓶頸。
        Ruby / Rails：2014 年開始以 Rails 開發網站後端；Python：碩士論文以 Python 文字探勘套件搭配 Flask 提供 Web Service 給 Rails 串接。
