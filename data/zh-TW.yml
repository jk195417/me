        to: 至今
        description: |
          2026/10 – 至今 Staff AI Engineer；2025/10 – 2026/10 Staff Software Engineer；2023/10 – 2025/10 Senior Software Engineer；2019/11 – 2023/10 Software Engineer。
          開發與維護服務 7 個地區、每日 3000+ 位使用者的變更管理與簽核系統，並與既有製造系統整合：集中資料、依營運計畫驗證修改、送簽核後自動回寫製造系統，加速製程迭代。
          帶領 4 人開發團隊，主持 Scrum 會議、Code Review 與結對程式設計，並為內外部團隊提供軟體架構設計與技術選型諮詢。
          以 Jenkins、Octopus、Docker、Helm 將服務從 Windows Server IIS 遷移至 Kubernetes，並導入 Azure 雲端服務。
          抓出資料庫 N+1 查詢改善近千倍系統效能；將 1TB 的 base64 檔案從資料庫遷移至儲存服務，CPU 由 100% 降至 10% 以下、記憶體由 64GB 降至 8GB；重寫 ETL，每日 Snowflake 上傳由 7 小時縮短至 1 分鐘。
          導入單元測試、Linter 與 Formatter 並在 git hook 與 CI 把關，追查根因償還技術債，讓團隊值班時數由每週 60+ 小時降至 5 小時以下。
