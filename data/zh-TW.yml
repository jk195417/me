chapters:
  introduction:
    title: 自我介紹
    content: |
      Hi，
      我叫楊竑昕，來自台灣高雄，現任美光科技 Staff AI Engineer，2014 年開始寫程式至今。
      大學就讀逢甲自控系，因為寫 8051、PLC 與 Arduino 而愛上寫程式，修完資工第二學程，補齊資料結構、作業系統、演算法、物件導向與資料庫等基本功。
      碩士在中山資管所，加入郭峰淵老師的實驗室，以文字探勘與自然語言處理研究社群網站的對話健康。
      2019 年加入美光至今，負責全球各廠區每天數千位使用者的變更管理與簽核平台，擔任約 20 人工程組織的設計負責人。專長是 .NET Core、Angular、雲端與容器化（Kubernetes、Azure），重視程式品質、可觀測性與開發者體驗，近年專注把 AI 帶進日常開發。
      個人優勢：擅長拆解複雜問題，溝通清楚有效。
      閒暇之餘我喜歡參與程式社群認識業界前輩；關注技術趨勢文章；翻翻 Github Trending；做些 side projects。
  skills:
    title: 專業技能
    content:
      description: |
        後端：C#、.NET Core、Entity Framework Core、AutoMapper、FluentValidation、Ruby on Rails、Python、Flask、Node.js、RESTful API、Message Queue、背景工作。
        前端：TypeScript、JavaScript、Angular、RxJS、Vue、Bootstrap、Sass、Electron。
        測試與品質：xUnit、Moq、AutoFixture、FluentAssertions、Jest、ESLint、Prettier、husky、SonarLint、dotnet analyzer、dotnet format。
        DevOps 與容器：Jenkins、Octopus、Docker、Docker Compose、Podman、Helm、Kubernetes、OpenShift。
        雲端：Azure（AD、AKS、Red Hat OpenShift、Key Vault、Service Bus、Blob Storage、Cache for Redis、Application Insights、Private Link）、Microsoft Graph API、Google Cloud、Cloudflare Workers、Cloudflare DNS。
        資料：MSSQL、PostgreSQL、MySQL、MongoDB、Redis、RabbitMQ、Snowflake；熟悉索引、鎖、交易、綱要設計與正規化。
        AI 輔助開發：GitHub Copilot、AI code review 規則、eval、agent context 檔、MCP server。
        文字探勘與 NLP：情緒分析、中文斷詞、BERT 詞向量；研究所修習統計、線性代數、影像處理與自然語言處理。
        開發實踐：OOP、SOLID、KISS、SSOT、依賴注入、TDD、設計模式、單向資料流。
